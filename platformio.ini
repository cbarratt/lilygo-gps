; Standalone build of LilyGO ExternalGPS_A7670G_Only for T-A7670G (ESP32-WROVER-E, 4MB)
; Verifies the onboard L76K GNSS by streaming decoded lat/lng over USB serial. No SIM needed.
[env:ta7670g]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.flash_size = 4MB
monitor_speed = 115200
extra_scripts = pre:load_env.py
build_flags =
    -mfix-esp32-psram-cache-issue
    -DBOARD_HAS_PSRAM
lib_deps =
    mikalhart/TinyGPSPlus@^1.1.0

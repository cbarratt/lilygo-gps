; T-A7670G GPS car tracker (ESP32-WROVER-E, 4MB). Modem GNSS via AT+CGNSSINFO,
; Traccar over WiFi/4G, web UI, OTA. Secrets injected from gitignored .env (load_env.py).
[env:ta7670g]
platform = espressif32@6.12.0
framework = arduino
board = esp32dev
board_build.flash_size = 4MB
monitor_speed = 115200
extra_scripts = pre:load_env.py
build_flags =
    -mfix-esp32-psram-cache-issue
    -DBOARD_HAS_PSRAM
lib_deps =
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
